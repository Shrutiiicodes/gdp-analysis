name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month, 03:00 UTC: refresh Brent, rerun everything, commit outputs

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Push / PR: prove the repo still runs end-to-end on the pinned environment.
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python run_all.py

      # Monthly / manual: also pull the latest Brent series, then commit whatever changed.
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python run_all.py --fetch

      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: scheduled pipeline rerun ($(date -u +%Y-%m-%d))"
          git push
